<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCMS Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="resources/css/main.css">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .service-icon {
      cursor: pointer;
      text-align: center;
      padding: 20px;
      border: 2px solid transparent;
      border-radius: 8px;
      transition: all 0.3s ease-in-out;
      background-color: #fff;
    }

    .service-icon:hover {
      transform: scale(1.05);
    }

    .service-icon.selected {
      border-color: #007bff;
      background-color: #e9f7ff;
    }

    .service-icon img {
      max-width: 50%;
      margin-bottom: 10px;
    }

    .service-icon p {
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <a href="index.html">
      <img src="resources/images/mcmslogo.jpg" alt="MCMS Logo">
    </a>
    <div class="profile">
      <img src="resources/images/profile.png" alt="User Avatar">
      <button class="btn btn-link text-dark text-decoration-none dropdown-toggle d-flex align-items-center" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="me-2 fw-bold">Rupen</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
        <li><a class="dropdown-item" href="profile.html">Profile</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="login.html">Logout</a></li>
      </ul>
    </div>
  </div>

  <!-- Services -->
  <div class="container services my-4">
    <div class="row row-cols-2 row-cols-md-3 g-3">
      <div class="col">
        <div class="service-icon" onclick="toggleSelection(this)">
          <img src="resources/images/service.png" alt="Service">
          <p>Service</p>
        </div>
      </div>
      <div class="col">
        <div class="service-icon" onclick="toggleSelection(this)">
          <img src="resources/images/repair.png" alt="Repair">
          <p>Repair</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container my-4">
    <h4>Details</h4>
    <hr>
    <!-- Service Package -->
    <div class="row align-items-center mb-4">
      <div class="col-12 col-md-4">
        <label>Select Quantity</label>
      </div>
      <div class="col-12 col-md-4 d-flex align-items-center">
        <div class="input-group">
          <button class="btn btn-outline-secondary btn-sm minus-btn">-</button>
          <input type="text" class="form-control text-center quantity-input" value="1" readonly>
          <button class="btn btn-outline-secondary btn-sm plus-btn">+</button>
        </div>
      </div>
    </div>
    
    <!-- Scheduled and Open Service -->
    <div class="row mb-4">
      <div class="col-12 col-md-4">
        <label>Select Date</label>
        <input type="date" class="form-control">
      </div>
      <div class="col-12 col-md-4">
        <label>Select Time</label>
        <input type="time" class="form-control">
      </div>
      
    </div>
    
    <!-- Terms and Buttons -->
    <div class="row">
      <div class="col-12">
        <a href="#"><p class="text-muted">T&C. Applied.</p></a>
      </div>
      <div class="col-6">
        <button id="addToCartBtn" class="btn w-100" style="background-color: #042e6e; color: white;">Add Service</button>
        <div id="alertContainer" class="mt-3"></div>
      </div>
      <div class="col-6">
        <a href="cart.html">
          <button class="btn btn-info w-100" style="color: white;">Book Service</button>
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="index.html">Home</a>
    <a href="bookings.html">My Services</a>
    <a href="cart.html">Cart</a>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleSelection(element) {
      // Deselect all service icons
      document.querySelectorAll('.service-icon').forEach(icon => {
        icon.classList.remove('selected');
      });

      // Select the clicked service icon
      element.classList.add('selected');
    }

    // Handle quantity increment and decrement
    document.querySelectorAll('.plus-btn').forEach(button => {
      button.addEventListener('click', () => {
        const input = button.previousElementSibling;
        const quantity = parseInt(input.value);
        input.value = quantity + 1;
      });
    });

    document.querySelectorAll('.minus-btn').forEach(button => {
      button.addEventListener('click', () => {
        const input = button.nextElementSibling;
        const quantity = parseInt(input.value);
        if (quantity > 1) {
          input.value = quantity - 1;
        }
      });
    });
  </script>
</body>
</html>
